    url: https://turismoburgos.org/ruta-en-moto-del-origen-del-hombre-al-origen-del-castellano/
    provincia: Burgos

  - nombre: Burgos · De las huellas de Castilla al clamor del Ebro
    url: https://turismoburgos.org/de-las-huellas-de-castilla-al-clamor-del-ebro/
    provincia: Burgos

  - nombre: Burgos · Maravillas naturales en ruta al Camino
    url: https://turismoburgos.org/maravillas-naturales-en-ruta-al-camino/
    provincia: Burgos

  - nombre: Burgos · Caminos ducales y joyas silenciosas
    url: https://turismoburgos.org/caminos-ducales-y-joyas-silenciosas/
    provincia: Burgos

  - nombre: Burgos · De Roma al vino eterno
    url: https://turismoburgos.org/de-roma-al-vino-eterno/
    provincia: Burgos

