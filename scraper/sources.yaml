# Páginas que el scraper revisa en cada pasada.
#
# Cada fuente es una página que describe una o varias rutas en moto con un recorrido
# identificable (salida, llegada y lugares de paso).
#
# Campos:
#   nombre     Nombre corto para los logs.
#   url        Página a descargar.
#   provincia  Opcional. Ayuda a ubicar los pueblos si la página no la indica.
#
# Si una página no cambia de una pasada a otra, no se vuelve a analizar.
#
# Comprobadas el 2026-09-14: responden, robots.txt permite leerlas y el texto de las
# rutas está en el HTML (el scraper no ejecuta JavaScript). Las de Turismo Burgos indican
# salida, llegada, pueblos de paso en orden y distancia. Se descartaron vivelamoto.org
# (páginas retiradas) y los viajes organizados con fechas y precio. Retiradas tras la primera
# prueba desde la Orange Pi (2026-09-15): Motocard y Komobi responden 403 al scraper, y la de
# Patou Pallars no describe ninguna ruta con recorrido.

sources:
  # ------------------------------------------------ oficiales: Turismo Burgos (Sodebur)
  - nombre: Burgos · Viaje al centro de la Sierra
    url: https://turismoburgos.org/ruta-en-moto-por-la-sierra-de-la-demanda/
    provincia: Burgos

