# ===== Perfil de produccion (activar con --spring.profiles.active=prod) =====
# Los valores sensibles se toman de variables de entorno (ver deploy/moteros.env.example).

server.port=${SERVER_PORT:8080}
server.address=127.0.0.1

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/moteros?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Europe/Madrid}
spring.datasource.username=${DB_USER:moteros}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# Swagger / OpenAPI: desactivados en produccion (la API solo la consume la app)
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# JWT: definir OBLIGATORIAMENTE un secreto propio en Base64 (>= 256 bits)
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration=${JWT_EXPIRATION:900000}
app.jwt.refresh-expiration=${JWT_REFRESH_EXPIRATION:2592000000}

# CORS: lista real de origenes, SIN comodin
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:https://moteros.app,https://www.moteros.app}

# Subida de imagenes
app.uploads.dir=${UPLOADS_DIR:/var/lib/moteros/uploads}
app.uploads.public-path=/uploads

server.forward-headers-strategy=framework
