spring.application.name=moteros
spring.datasource.url=jdbc:mysql://localhost:3306/moteros
spring.datasource.username=root
spring.datasource.password=
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.hibernate.ddl-auto=validate

# Flyway aplica las migraciones de db/migration antes de que Hibernate valide.
# baseline-on-migrate permite adoptar Flyway sobre bases que ya tenian el esquema
# creado a mano (la de produccion y la de XAMPP): se marcan en la version 1 y solo
# se les aplica lo posterior, en vez de intentar recrear las tablas.
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.baseline-description=Esquema creado antes de adoptar Flyway
spring.jpa.open-in-view=false

# ===== JWT =====
# Secreto en Base64 (>= 256 bits al decodificar). SOLO para desarrollo: cambiar en produccion.
app.jwt.secret=bW90ZXJvcy1qd3Qtc2VjcmV0LWRldi1vbmx5LWNoYW5nZS1tZS1wbGVhc2UtMDEyMzQ1Njc4OS1hYmNkZWZnaA==
# Validez del access token en ms (15 min). El cliente lo renueva con POST /api/auth/refresh.
app.jwt.expiration=900000
# Validez del refresh token en ms (30 dias)
app.jwt.refresh-expiration=2592000000

# ===== Rate limit del login =====
# Intentos fallidos permitidos por identificador (email/usuario) y por IP en la ventana.
security.rate-limit.login.max-attempts-per-identificador=${LOGIN_MAX_ATTEMPTS_PER_IDENTIFICADOR:5}
security.rate-limit.login.max-attempts-per-ip=${LOGIN_MAX_ATTEMPTS_PER_IP:20}
security.rate-limit.login.window-minutes=${LOGIN_RATE_LIMIT_WINDOW_MINUTES:15}

# ===== Recuperacion de contrasena =====
security.password-reset.expiration-minutes=${PASSWORD_RESET_EXPIRATION_MINUTES:15}

# Envio de correo via SMTP de Gmail con una contrasena de aplicacion (no la contrasena
# normal de la cuenta). MAIL_PASSWORD no tiene valor por defecto a proposito: sin
# configurarla la app arranca igual, solo falla el envio del codigo de recuperacion.
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:devepsdev@gmail.com}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.default-encoding=UTF-8

# ===== CORS =====
# Origenes permitidos, separados por comas. En produccion poner la lista real (sin '*').
app.cors.allowed-origins=*

# ===== Subida de imagenes =====
# Carpeta local donde se guardan (relativa al directorio de ejecucion)
app.uploads.dir=uploads
# Prefijo de URL publica bajo el que se sirven
app.uploads.public-path=/uploads
spring.servlet.multipart.max-file-size=8MB
spring.servlet.multipart.max-request-size=8MB