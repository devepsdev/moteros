# ===== Perfil de tests: H2 en memoria, esquema generado desde las entidades =====
spring.datasource.url=jdbc:h2:mem:moteros_test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

spring.sql.init.mode=never

# JWT (valores de test)
app.jwt.secret=bW90ZXJvcy1qd3Qtc2VjcmV0LWRldi1vbmx5LWNoYW5nZS1tZS1wbGVhc2UtMDEyMzQ1Njc4OS1hYmNkZWZnaA==
app.jwt.expiration=86400000

logging.level.org.springframework=WARN
logging.level.org.hibernate=WARN
spring.main.banner-mode=off
