# /etc/nginx/sites-available/moteros-api
# Reverse proxy para la API moter@s. Vhost HTTP-only: certbot --nginx anade el bloque 443.
# Sustituye  __DOMAIN__  por el dominio real (p.ej. moteros-api.deveps.dev).

server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;

    # Reto ACME de Let's Encrypt (certbot webroot / renovaciones)
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # Tamano maximo de subida (imagenes: 8 MB + margen)
    client_max_body_size 12m;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout    60s;
        proxy_send_timeout    60s;
    }
}
